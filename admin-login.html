<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EverRise Markets Admin Login</title>

<style>

body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:url("images/broker-bg.png") center/cover no-repeat fixed;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.login-box{

width:360px;

background:rgba(11,31,58,.90);

padding:40px;

border-radius:15px;

text-align:center;

box-shadow:0 0 25px rgba(212,175,55,.35);

}

h2{

color:#D4AF37;

margin-bottom:25px;

}

input{

width:100%;

padding:15px;

margin:12px 0;

border:none;

border-radius:8px;

font-size:16px;

}

button{

width:100%;

padding:15px;

background:#D4AF37;

color:#0B1F3A;

font-weight:bold;

font-size:18px;

border:none;

border-radius:8px;

cursor:pointer;

}

button:hover{

background:#FFD700;

}

</style>

</head>

<body>

<div class="login-box">

<h2>EverRise Markets Admin</h2>

<input type="text" placeholder="Username">

<input type="password" placeholder="Password">

<button>Secure Login</button>

</div>

</body>

</html>
