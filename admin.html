<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EverRise Markets Admin Dashboard</title>

<style>

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#071220;
    color:white;
}

.sidebar{
    position:fixed;
    width:250px;
    height:100%;
    background:#0B1F3A;
    padding-top:30px;
}

.sidebar h2{
    text-align:center;
    color:#D4AF37;
}

.sidebar a{
    display:block;
    color:white;
    text-decoration:none;
    padding:15px 25px;
}

.sidebar a:hover{
    background:#D4AF37;
    color:#0B1F3A;
}

.main{
    margin-left:250px;
    padding:30px;
}

.card{
    background:#10233f;
    padding:20px;
    border-radius:12px;
    margin-bottom:20px;
}

</style>

</head>

<body>

<div class="sidebar">

<h2>EverRise Admin</h2>

<a href="#">Dashboard</a>
<a href="#">Clients</a>
<a href="#">Deposits</a>
<a href="#">Withdrawals</a>
<a href="#">Trading Accounts</a>
<a href="#">KYC Verification</a>
<a href="#">Support Tickets</a>
<a href="#">Settings</a>
<a href="#">Logout</a>

</div>

<div class="main">

<div class="card">
<h1>Dashboard</h1>
<p>Welcome to the EverRise Markets Admin Control Center.</p>
</div>

<div class="card">
<h2>Total Clients</h2>
<p>0</p>
</div>

<div class="card">
<h2>Total Deposits</h2>
<p>$0.00</p>
</div>

<div class="card">
<h2>Total Withdrawals</h2>
<p>$0.00</p>
</div>

</div>

</body>
</html>
