<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#0f172a;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

form{
    background:#1e293b;
    padding:30px;
    border-radius:10px;
    width:320px;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
}

button{
    width:100%;
    padding:12px;
    background:#38bdf8;
    color:white;
    border:none;
    cursor:pointer;
}
</style>
</head>

<body>

<form>
<h2>Create Account</h2>

<input type="text" placeholder="Full Name" required>

<input type="email" placeholder="Email" required>

<input type="password" placeholder="Password" required>

<button>Create Account</button>

</form>

</body>
</html>
